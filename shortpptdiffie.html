<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation on Diffie-Hellman at KSCTE Competition</title>
    <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'STIX Two Text', serif; /* LaTeX-like font */
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            margin: 20px auto;
            padding: 15px;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
        }
        .presentation-embed {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(63, 69, 81, 0.2);
            margin: 20px 0;
        }
        .presentation-embed iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        a.source-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 14px;
            color: #1a73e8;
            text-decoration: none;
        }
        a.source-link:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Presentation on Diffie-Hellman Key Exchange</h1>
        <p>Presented at District Level 7-minute Presentation Competition, <br> Organized by Kerala State Council for Science, Technology and Environment (KSCSTE)</p>
        <div class="presentation-embed">
            <iframe loading="lazy" 
                src="https://www.canva.com/design/DAGZW2QM9Y0/1Xm_BrnAw9aQZzG00Mq3AQ/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen">
            </iframe>
        </div>
    </div>
    <footer>
        &copy; 2024 Rohan Thomas. All Rights Reserved.
    </footer>
</body>
</html>
